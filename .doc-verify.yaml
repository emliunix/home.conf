schema_version: 1
kind: document-verification
# Ordered, last-match-wins. Every rule runs design-04 verification modules: `doc-verify:NAME` is
# an engine library shipped in doc-verify/lib, a path is one of this repository's modules.
# Goal files follow design/00's `goals/NN-<topic>.md` form; the dated
# goals/2026-09-09-goal-file-funnel.md predates it and is not governed.
documents:
  - pattern: design/{0[1-9],[1-9][0-9]}-*.md
    artifact_kind: design
    modules: [doc-verify:artifact, doc-verify/modules/design.yaml]
  - pattern: design/03-companion-driven-document-verification.md
    artifact_kind: design
    modules: [doc-verify:artifact, doc-verify/modules/design.yaml, doc-verify/modules/design-03.yaml]
  - pattern: goals/[0-9][0-9]-*.md
    artifact_kind: goal
    modules: [doc-verify:goal]
    status_from: title
  # doc-verify's own module docs, dogfooding the engine's module-* types.
  - pattern: docs/modules/*/contract.md
    artifact_kind: module-contract
    modules: [doc-verify:module-contract]
  - pattern: docs/modules/*/model.md
    artifact_kind: module-model
    modules: [doc-verify:module-model]
  - pattern: docs/modules/*/properties.md
    artifact_kind: module-properties
    modules: [doc-verify:module-properties]
  - pattern: docs/modules/*/verification.md
    artifact_kind: module-verification
    modules: [doc-verify:module-verification]
  # Durable work receipts: the intermediate evidence and implementer-to-reviewer
  # handoff for a frozen object. The README is guidance, not a receipt.
  - pattern: receipts/**/*.md
    artifact_kind: receipt
    modules: [doc-verify:receipt]
  - pattern: receipts/README.md
    exclude: true
invalidation_patterns:
  - .doc-verify.yaml
  - doc-verify/**
  - skills/verification/**
  - skills/flow-common/**
  - skills/flow-grill-review/**
  - skills/flow-retro/**
  - skills/flow-supervise/**
  - skills/goal-file/**
judge:
  kind: jev
  model: jev-1.13.0
  client_sha256: ce983f8de97d5b30d527a7116f0c49ad3d17e098d2c3f17c9600041260c65dcb
  attestation_max_age_seconds: 86400
policy:
  kind: semantic-boundary
  version: 1
  max_evidence_bytes: 24000
  forbidden_literals: []
