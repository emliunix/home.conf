repos:
  - repo: local
    hooks:
      - id: document-contracts
        name: document contracts
        language: system
        entry: npm exec doc-verify -- check --staged --profile auto --format text
        pass_filenames: false
        files: '(^|/).+\.(md|ya?ml)$|^doc-verify/|^package(-lock)?\.json$'
        require_serial: true
      - id: oxlint
        name: oxc lint gate
        language: system
        # The oxlint gate, wrapped rather than invoked directly. oxlint exits 1
        # for BOTH a finding and a broken run (eslint exits 2 on a crash and 1 on
        # a finding), so the wrapper restores the discrimination on the output
        # stream: a finding emits parseable JSON on stdout, a broken run emits
        # plain text there. It also asserts the typed rule is ARMED, because
        # `--type-aware` and `--deny <rule>` are both load-bearing and neither
        # alone is visible in the exit status -- with either missing, the run
        # exits 0 on a file with ten real violations while still printing an
        # unrelated diagnostic. Exit 0 pass, 1 finding, 2 crash.
        entry: npm run --silent lint
        pass_filenames: false
        files: '^doc-verify/.*\.(ts|mjs)$|^oxlint\.config\.json$|^scripts/oxlint-gate\.mjs$|^scripts/__gate-probe__/'
        require_serial: true
      - id: skill-dispatch
        name: skill dispatch coverage
        language: system
        # Every skill that ships a dispatcher runs its own coverage check. The
        # check asserts reachability (kind -> template -> reference -> anchor),
        # not prose quality, and it starts green so a red is a regression.
        entry: bash -c 'for f in skills/*/tests/check-dispatch.mjs; do [ -e "$f" ] || continue; node "$f" || exit 1; done'
        pass_filenames: false
        files: '^skills/'
        require_serial: true
      - id: skill-l0
        name: skill package lint (L0 + frozen lock)
        language: system
        # Every skill that ships an L0 lint runs it on an edit to that package. L0
        # checks the instrument's own consistency -- frontmatter, rubric items naming
        # their flipping defect, case cites resolving, and the frozen lock matching
        # the package. The lock check is why this hook exists: on 2026-10-05 all six
        # entries of report-style's lock named a different vintage of the package and
        # NOTHING read the file, so 'the last behaviorally evaluated surface' named a
        # surface that was not in the tree. A lock nothing verifies is decoration.
        entry: bash -c 'for f in skills/*/tests/l0.py; do [ -e "$f" ] || continue; uv run --with pyyaml python "$f" || exit 1; done'
        pass_filenames: false
        files: '^skills/'
        require_serial: true
      - id: tracked-ignored
        name: no gitignored file is tracked
        language: system
        # Claim: a path matching .gitignore is not also in the index. The first
        # live red was skills/skill-creator/scripts/__pycache__/quick_validate.cpython-{311,314}.pyc
        # while __pycache__/ and *.py[cod] were already ignored. `git ls-files -ci
        # --exclude-standard` is the observable; an empty discovery is not a pass
        # (the script's --self-test seeds a tracked .pyc, requires RED, restores).
        entry: node scripts/check-tracked-ignored.mjs
        pass_filenames: false
        always_run: true
      - id: symlink-containment
        name: no tracked symlink escapes the repository
        language: system
        # Claim: a tracked mode-120000 entry's RESOLVED target stays inside the
        # repository root. Separate from tracked-ignored by subject: that guard
        # sees the tracked-AND-ignored intersection, so a non-ignored symlink is
        # outside its population by construction. `tskill`'s manage_skill can move
        # a target link into the versioned source tree, which makes this the
        # repository-level backstop. A relative `../../outside` escapes and is the
        # form an absoluteness predicate misses; the script's --self-test requires
        # each escape arm CAUGHT and both legitimate internal links ALLOWED, and
        # exits 2 (not a gate) rather than 0 when it cannot run.
        entry: node scripts/check-symlink-containment.mjs
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: flow-skills-eval-lock
        name: flow-skills-eval frozen prefix lock
        language: system
        # The flow skills ship a SECOND, separate frozen lock:
        # flow-skills-eval/frozen-prefix.lock.json hashes the assembled eval prefix
        # (the three flow SKILL.md bodies + the prompt), not the per-skill package
        # the skill-l0 hook above covers. It drifted silently on 2026-10-08: commit
        # `85b25b5` edited `skills/flow-common/SKILL.md`, the lock still pinning
        # `48b1de87...` went stale, and the suite read `1 failed / 44 passed` with
        # NO hook and NO workflow watching either path -- so the drift survived four
        # commits and only surfaced during the sprint-close retro. Same lesson as
        # skill-l0's comment, one directory over: a lock nothing verifies is
        # decoration. This runs the lock assertion (not the full suite) on any edit
        # to the flow skills or the eval harness.
        # Drive the Vite+ project through its documented CLI. Using npm here
        # makes the result depend on which npm wins the ambient PATH; a system
        # npm fails devEngines before the lock assertion runs.
        entry: bash -c 'cd flow-skills-eval && ./node_modules/.bin/vp test --run tests/prompt.test.ts'
        pass_filenames: false
        files: '^skills/flow-|^flow-skills-eval/'
        require_serial: true
      - id: tskill-pytest
        name: tskill pytest (uv --frozen)
        language: system
        # #283: tskill's pytest suite (16 collected tests) ran in no gate — #268's
        # verification was manual. Drive it with uv; `--frozen` is load-bearing so
        # the hook cannot rewrite the tracked tskill/uv.lock when this machine's
        # uv index differs from the lock's registry. The wrapper prints the
        # collected population (do not grep `def test_`: conftest fixtures match).
        # Do not add a tskill/.venv gitignore rule — uv's own `.venv/.gitignore`
        # already ignores children.
        entry: node scripts/check-tskill-pytest.mjs
        pass_filenames: false
        files: '^tskill/|^scripts/check-tskill-pytest\.mjs$|^\.pre-commit-config\.yaml$'
        require_serial: true
