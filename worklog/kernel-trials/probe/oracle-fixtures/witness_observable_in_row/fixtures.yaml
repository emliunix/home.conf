# Round 4c candidate set: witness_observable_in_row. Reuses the verification_falsifies fixture files (files_from);
# the module is fixture-local (extra_files). Rows: row1 = 'Binding by construction' … row14 =
# 'Trust boundary holds' (design/04's table). Every fixture is design/04 at HEAD with only the
# Failure witness column changed (invariant checked by the runner).
oracle: witness_observable_in_row
declared_in: worklog/kernel-trials/probe/oracle-fixtures/witness_observable_in_row/module.yaml (fixture-local)
threshold: 0.5
constraint: round4c-witness-observable-in-row
files_from: ../verification_falsifies
extra_files:
  worklog/kernel-trials/probe/oracle-fixtures/witness_observable_in_row/module.yaml: module.yaml
rule:
  pattern: design/{0[1-9],[1-9][0-9]}-*.md
  artifact_kind: design
  modules:
    - doc-verify:artifact
    - worklog/kernel-trials/probe/oracle-fixtures/witness_observable_in_row/module.yaml
document: design/04-modular-verification-language.md
companion:
  path: design/04-modular-verification-language.yaml
  file: companion.yaml
invariant: evidence-column-only
atom:
  inputs: "witness_observable_in_row(D, R, [Property, Failure witness])"
  evidence: "core.cells(D, R, L)"
  sections:
    - verification-design
  column: Failure witness
  per_row: true
  rows: 14
fixtures:
  - name: good
    file: good.md
    expect: holds
    note: >-
      design/04 at HEAD. Rows 10, 12, 13 are wordy but genuine; row 11 repeats row 1's first clause and is a genuine witness for nested classification too.
  - name: defective-gross
    file: defective-gross.md
    expect: fails
    note: >-
      every Failure witness cell restates its property (round 3's gross edit).
  - name: defective-subtle
    file: defective-subtle.md
    expect: holds
    expect_cells:
      row1: fails
    note: >-
      round 3's subtle edit: only 'Binding by construction' restated.
  - name: defective-subtle3
    file: defective-subtle3.md
    expect: holds
    expect_cells:
      row1: fails
      row8: fails
      row12: fails
    note: >-
      rows 1, 8 and 12 restated; the other eleven are HEAD's.
  - name: controls
    file: controls.md
    expect: fails
    expect_cells:
      row1: fails
      row2: holds
      row3: fails
      row4: fails
      row5: holds
      row6: fails
      row7: fails
      row8: holds
      row9: fails
      row10: holds
      row11: fails
      row12: fails
      row13: holds
      row14: fails
    note: >-
      style controls: tautological negations (rows 1, 4, 9), confident pass assertions (3, 14), padded restatements (6, 12), command pointers (7, 11) all fail; short genuine witnesses (2, 5, 13) and genuine witnesses without failure words (8, 10) hold.
  - name: defective-swapped
    file: defective-swapped.md
    expect: fails
    note: >-
      every witness moved to the next row: genuine observables for the wrong property; C2 sees the property and must fail them (the axis test).
