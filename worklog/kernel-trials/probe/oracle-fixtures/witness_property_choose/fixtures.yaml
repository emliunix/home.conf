# Round 9 candidate E1 (the extraction form; pre-run amendment 2026-10-13 12:50 in
# round-9-preregistration.md): a `choose` oracle naming the property whose failure the Failure
# witness cell describes, over the same eight fixtures as the R2 set (witness_relevant_in_table),
# files from ../verification_falsifies (design/04's verification table: row1 = 'Binding by
# construction' ... row14 = 'Trust boundary holds'). The labels and their full property names are
# in module.yaml.
#
# `expect_cells` per row is the expected LABEL, derived mechanically from the lead's labels
# (verification_falsifies/relevance-row-labels.yaml, label_by: lead, copied below under each
# fixture's `labels:` unchanged): a `holds` row expects its own property; a `fails` row expects the
# property of the base row whose witness it carries (the fixture's `from[i]`, or the row's own
# `from` on the relevance-controls decoys); a `neutral` control expects `none`; an `ambiguous` row
# keeps `ambiguous` (reported, not counted). `counts:`/`reported:` are the labels file's, unchanged.
#
# Reading (the amendment's, not the runner's): a row is CAUGHT when the chosen label is not the
# row's own property (any other label, or `none`) at p >= 0.6 on both repeats; a PRECISE catch
# names the source row (chosen label == expect_cells on a wrong row). A row is HELD when the chosen
# label is the row's own property at p >= 0.6. The runner's sep@0.6 column (label == expect_cells
# at p >= 0.6) is the held reading on genuine rows and the precise-catch reading on wrong rows; a
# catch that names a third property or `none` is read from the sidecar leaves, not from sep@0.6.
# Bars (round-9-verdict.md): caught >= 8 of 10 defective-swapped, >= 11 of 12 (s1) and of 13 (s2),
# >= 4 of 5 decoys; held >= 13 of 14 on good and shared-1-11. `neutral` controls (expect `none`)
# are reported, not counted.
oracle: witness_property_choose
declared_in: worklog/kernel-trials/probe/oracle-fixtures/witness_property_choose/module.yaml (fixture-local)
threshold: 0.5
separation: 0.6
label_by: lead
labels_file: ../verification_falsifies/relevance-row-labels.yaml
constraint: round9-witness-property-choose
files_from: ../verification_falsifies
extra_files:
  worklog/kernel-trials/probe/oracle-fixtures/witness_property_choose/module.yaml: module.yaml
rule:
  pattern: design/{0[1-9],[1-9][0-9]}-*.md
  artifact_kind: design
  modules:
    - doc-verify:artifact
    - worklog/kernel-trials/probe/oracle-fixtures/witness_property_choose/module.yaml
document: design/04-modular-verification-language.md
companion:
  path: design/04-modular-verification-language.yaml
  file: companion.yaml
invariant: evidence-column-only
atom:
  inputs: "witness_property_choose(D, R, Failure witness, L)"
  evidence: "core.row_with_column(D, R, C)"
  sections:
    - verification-design
  column: Failure witness
  per_row: true
  rows: 14
