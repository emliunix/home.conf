# Round 9 candidate R1' (R1's paraphrase, on defective-swapped and relevance-controls only).
# Fixture-local. Question verbatim from round-9-preregistration.md.
schema_version: 2
kind: verification-module
module: round9.witness_relevant_paraphrase
extends: [doc-verify:artifact]
rounds: 1
params:
  statuses: [draft, reviewed, pending-retro, landed]
oracles:
  witness_relevant_paraphrase(D, R, L):
    ask: >-
      Read a property and its failure-witness cell from a design's verification table. Would the
      situation the cell describes, if it happened, show that this property had failed? Say holds if
      yes. Say fails if what it describes is really a failure of some other property. Ignore how well
      the cell is written and whether it is observable.
    evidence: core.cells(D, R, L)
    threshold: 0.5
    max_bytes: 4000
rules:
  verification_design_section(D, S): top(D, S), core.heading(D, S, 'Verification design')
  witness_header(D, T, C): core.header_pos(D, T, C, _), C in ['Failure witness', 'Observable failure witness']
constraints:
  round9-witness-relevant-paraphrase:
    forall: verification_design_section(D, S), core.table(D, S, T), witness_header(D, T, C), core.row(D, T, R)
    require: core.cell(D, R, C), witness_relevant_paraphrase(D, R, ['Property', C])
    severity: error
    profiles: [promotion]
    message: "{R} in {D}: the failure witness describes a failure of a different property"
