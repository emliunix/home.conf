# Round 8: module-model page fixtures for current_not_history (kernel-trials round-8-preregistration.md §Fixtures).
# good.md = doc-verify/lib/examples/module-model.md at HEAD; gross.md = module-model-bad.md at HEAD (checked by
# the runner through `sources`). Every other fixture is good.md with its one `edit` applied (checked: `edit ok`).
# Expected label rule (pre-registered): a section is `fails` iff its body (heading plus subtree, core.body)
# contains the edit, else `holds`; the title section's body is the whole page. The runner recomputes this rule
# from the edit and the engine's sections and refuses a mismatch (`expect-rule`). Section ids are the engine
# slugger's (an em dash leaves two hyphens: "acme-widget — model" is `acme-widget--model`; a subsection id is its own slug).
# Draft status pre-registered per fixture: PASS except gross (NO-GO, the dated-prose regex).
# `seeded: false` (good-near): its edit is the margin sentence, not a defect, so every section holds.
# `judged: false` (gross): a structural NO-GO returns before the judge (checker.ts), so the control has no
# leaf at promotion either; its sections are listed under the rule for the record and are never asked.
set: module_model_pages
oracle: current_not_history
ledger_suffix: model
declared_in: doc-verify/lib/module-model.yaml
threshold: 0.5
constraint: module-model-is-current
rule:
  pattern: docs/modules/_fixtures/*.md
  artifact_kind: module-model
  modules:
    - doc-verify:module-model
document: docs/modules/_fixtures/model.md
sources:
  good.md: doc-verify/lib/examples/module-model.md
  gross.md: doc-verify/lib/examples/module-model-bad.md
atom:
  inputs: current_not_history(D, S)
  evidence: core.body(D, S)
  per_section: true
fixtures:
  - name: good
    file: good.md
    draft: PASS
    expect_sections:
      acme-widget--model: holds
      state: holds
    why:
      acme-widget--model: "no edit: good.md is the library's example page at HEAD"
      state: "no edit: good.md is the library's example page at HEAD"
    note: doc-verify/lib/examples/module-model.md at HEAD, unedited; regex-clean.
  - name: good-near
    file: good-near.md
    draft: PASS
    seeded: false
    expect_sections:
      acme-widget--model: holds
      state: holds
    why:
      acme-widget--model: the added sentence narrates a current rule in a Concepts-like voice with no history word; nothing here is history
      state: the added sentence narrates a current rule in a Concepts-like voice with no history word; nothing here is history
    edit:
      cut: one current-rule sentence added in state (new last paragraph)
      from: |
        from those two.
      to: |
        from those two.

        An order is **pending** until the ledger records it; once recorded it is never edited, and a change is a new order.
    note: "the margin case: regex-clean, reads like a narration but states current law."
  - name: subtle-1
    file: subtle-1.md
    draft: PASS
    expect_sections:
      acme-widget--model: fails
      state: holds
    why:
      acme-widget--model: the title's body is the whole page, so it contains the edit (the title section's own text (a paragraph between the H1 and the H2))
      state: the edit is outside this section's body (the title section's own text (a paragraph between the H1 and the H2))
    edit:
      cut: the regex-clean history sentence "Placement previously returned the ledger row; callers moved to the id after the double-count." placed in the title section's own text (a paragraph between the H1 and the H2)
      from: |
        # acme-widget — model
      to: |
        # acme-widget — model

        Placement previously returned the ledger row; callers moved to the id after the double-count.
    note: subtle history the dated-prose regex does not catch; expected fails iff the section's body contains the edit.
  - name: subtle-2
    file: subtle-2.md
    draft: PASS
    expect_sections:
      acme-widget--model: fails
      state: fails
    why:
      acme-widget--model: the title's body is the whole page, so it contains the edit (state (after its first sentence))
      state: the edit is in this section's body (state (after its first sentence))
    edit:
      cut: the regex-clean history sentence "As of v2 the order is a map; it used to be a list." placed in state (after its first sentence)
      from: keyed by sku. The **ledger**
      to: keyed by sku. As of v2 the order is a map; it used to be a list. The **ledger**
    note: subtle history the dated-prose regex does not catch; expected fails iff the section's body contains the edit.
  - name: subtle-3
    file: subtle-3.md
    draft: PASS
    expect_sections:
      acme-widget--model: fails
      state: fails
    why:
      acme-widget--model: the title's body is the whole page, so it contains the edit (state (end of its paragraph))
      state: the edit is in this section's body (state (end of its paragraph))
    edit:
      cut: the regex-clean history sentence "Originally idempotent only within a session." placed in state (end of its paragraph)
      from: from those two.
      to: from those two. Originally idempotent only within a session.
    note: subtle history the dated-prose regex does not catch; expected fails iff the section's body contains the edit.
  - name: gross
    file: gross.md
    draft: NO-GO
    judged: false
    expect_sections:
      acme-widget--model: fails
      state: fails
    why:
      acme-widget--model: the title's body is the whole page, so it contains the edit (the shipped -bad page's dated 'Round 5 / we tried / then changed' prose)
      state: the edit is in this section's body (the shipped -bad page's dated 'Round 5 / we tried / then changed' prose)
    edit:
      cut: "doc-verify/lib/examples/module-model-bad.md: its dated history edit (trips the dated-prose regex)"
      from: |-
        An **order** is a set of lines keyed by sku. The **ledger** records each accepted order under
        its id. The only mutable state is the pending order and the ledger; everything else is derived
        from those two.
      to: We tried storing orders in a list in round 3 (2026-09-20), then changed to a map keyed by id.
    note: a control that the structural pre-check still catches it (draft NO-GO), not a judge measurement.
