        row5: { label: fails, confidence: medium, why: "static checks (an unsafe construct accepted) on modules compose" }
        row6: { label: fails, confidence: high, why: "composition failures on rounds bounded" }
        row7: { label: ambiguous, why: "rounds bounded on request shape: a depth-1 batched program's one round is both" }
        row8: { label: fails, confidence: high, why: "request shape on extends law" }
        row9: { label: fails, confidence: high, why: "extends law on diagnostics" }
        row10: { label: fails, confidence: high, why: "diagnostics on nesting baseline" }
        row11: { label: ambiguous, why: "nesting baseline's populations on nested classification: shared 'nested' vocabulary" }
        row12: { label: fails, confidence: high, why: "nested classification on migration parity" }
