# Oracle fixture set (prototype of the design 05 oracle toolkit format). Each defective
# fixture is good.md with exactly its edit applied: the runner checks good.replace(from, to).
oracle: verification_falsifies
declared_in: doc-verify/modules/design.yaml
ask: The verification design names observable failure witnesses for its load-bearing claims.
threshold: 0
constraint: design-verification-falsifies
rule:
  pattern: design/{0[1-9],[1-9][0-9]}-*.md
  artifact_kind: design
  modules:
    - doc-verify:artifact
    - doc-verify/modules/design.yaml
document: design/04-modular-verification-language.md
companion:
  path: design/04-modular-verification-language.yaml
  file: companion.yaml
atom:
  inputs: verification_falsifies(D, verification-design)
  evidence: core.body(D, S)
  sections:
    - verification-design
fixtures:
  - name: good
    file: good.md
    expect: holds
    source: design/04-modular-verification-language.md at HEAD
  - name: defective-gross
    file: defective-gross.md
    expect: fails
    edit:
      cut: every 'Failure witness' cell (14 rows) replaced by a restatement of the row's property; Property and Command columns and the closing paragraph untouched
      from: |
        | Property | Failure witness | Command |
        | --- | --- | --- |
        | Binding by construction | Two atoms of one oracle over different sections receive each other's answer, or reordering the atoms changes any fact | `npm test -- oracles` |
        | Threshold only demotes | An answer below its threshold becomes the opposite label, or any rule reads a probability | `npm test -- oracles` |
        | Three-valued soundness | `forbid` or `require` over an unknown atom is `satisfied`, or `not` of an unknown atom is true | `npm test -- evaluate` |
        | Static checks | An unsafe variable, a negation cycle, recursion through an oracle, a non-ground oracle call, a predicate outside the whitelist, or an oracle deeper than `rounds` is accepted | `npm test -- language` |
        | Modules compose | Two libraries defining `problem` collide, a param change has no effect, a diamond creates two instances, an import cycle or repository escape resolves, or weakening without `waive` is accepted | `npm test -- modules` |
        | Rounds bounded | A depth-2 program makes a number of rounds other than 2, a depth-1 `batched` program makes more than 1 round, or a single atom's evidence is split across requests | `npm test -- evaluate` |
        | Requests shaped as declared | Under `batched`, a round's atoms do not share one request; under `per-atom`, an atom shares its request with another; an unknown `request_shape` loads; or the default stops being `batched` | `npm test -- request-shape` |
        | Extends law | A child that raises an inherited threshold, changes an inherited oracle, or adds or widens a `warning` loads without `waive:`, or any waiver-free change improves a seeded document's verdict | `npm test -- modules` |
        | Diagnostics complete | A violation report lacks bindings, the population, a proof leaf with label and distribution, or the repair hint | `npm test -- diagnostics` |
        | Nesting baseline | Against sandbox-deploy `c9edcf0` the populations are not 19 documents, 298 section facts, 104 selected facts, and 0 nested pairs, or the seeded case does not give exactly 1 | `node doc-verify/dist/cli.js check --paths 'design/*.md' --verbose --format json` run from a sandbox-deploy worktree at `c9edcf0` |
        | Nested classification (scripted) | Two atoms of one oracle over different sections receive each other's answer, or a `scope` child is labelled from the wrong evidence | `npm test -- oracles` (scripted judge). There is no committed `live` suite; a live judge run is `.github/workflows/judge-advisory.yml` (fails on a finding, not a required check). |
        | Migration parity | A migrated home.conf contract's verdict differs from its v1 verdict at the parent commit, uncached and live, except for the named exception | `check --paths` over the nine consumers' documents with `--profile promotion --refresh`, run at the parent and at the change. Not a PR gate. |
        | Migrated-constraint separation | For some migrated constraint, a known-good document and a known-bad document land on the same side (both pass or both fail), uncached and live | No committed `separation` suite and no good/bad pair per constraint. Not claimed as covered. Structural draft is `npm run check` / CI `document-contract`. |
        | Trust boundary holds | An LLM fallback, a split atom's evidence, more requests than the chosen `request_shape` allows, unsafe outbound evidence, or a PASS driven by confidence becomes reachable | `npm test -- semantic confidentiality` |
      to: |
        | Property | Failure witness | Command |
        | --- | --- | --- |
        | Binding by construction | Each answer is bound to the atom it was asked for | `npm test -- oracles` |
        | Threshold only demotes | A threshold only ever demotes an answer to unknown | `npm test -- oracles` |
        | Three-valued soundness | Evaluation is sound under three-valued logic | `npm test -- evaluate` |
        | Static checks | The static checks are correct | `npm test -- language` |
        | Modules compose | Modules compose correctly | `npm test -- modules` |
        | Rounds bounded | The number of rounds is bounded as declared | `npm test -- evaluate` |
        | Requests shaped as declared | Requests are shaped as the module declares | `npm test -- request-shape` |
        | Extends law | The extends law is enforced | `npm test -- modules` |
        | Diagnostics complete | Diagnostics are complete | `npm test -- diagnostics` |
        | Nesting baseline | The nesting baseline is reproduced | `node doc-verify/dist/cli.js check --paths 'design/*.md' --verbose --format json` run from a sandbox-deploy worktree at `c9edcf0` |
        | Nested classification (scripted) | Nested sections are classified correctly | `npm test -- oracles` (scripted judge). There is no committed `live` suite; a live judge run is `.github/workflows/judge-advisory.yml` (fails on a finding, not a required check). |
        | Migration parity | The migration preserves every verdict | `check --paths` over the nine consumers' documents with `--profile promotion --refresh`, run at the parent and at the change. Not a PR gate. |
        | Migrated-constraint separation | Migrated constraints separate good documents from bad ones | No committed `separation` suite and no good/bad pair per constraint. Not claimed as covered. Structural draft is `npm run check` / CI `document-contract`. |
        | Trust boundary holds | The trust boundary holds | `npm test -- semantic confidentiality` |
    why: A restatement of the property ('The static checks are correct') is the claim itself, not an observable event that occurs when the claim is false, so no load-bearing claim has a failure witness.
  - name: defective-subtle
    file: defective-subtle.md
    expect: fails
    edit:
      cut: the 'Failure witness' cell of the one row the rationale calls the root of the defects (Binding by construction) replaced by a restatement
      from: "| Binding by construction | Two atoms of one oracle over different sections receive each other's answer, or reordering the atoms changes any fact | `npm test -- oracles` |"
      to: "| Binding by construction | Each answer is bound to the atom it was asked for | `npm test -- oracles` |"
    why: Binding by construction is the load-bearing claim (the rationale says identity is the root of the reported defects); its witness now restates the claim, so that claim has no observable failure witness and the ask ('for its load-bearing claims') is not met.
