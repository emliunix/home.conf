id: static-nonground-not
gate: Static checks
module: |
  schema_version: 2
  kind: verification-module
  module: w
  rounds: 3
  imports: {core: doc-verify:core}
  rules:
    lonely(D, X): core.section(D, X, _), \+ core.child(D, X, Y)
  constraints:
    c1: {forall: "core.section(D, S, _)", require: "lonely(D, S)", severity: error}
facts:
  - section(d, a, root)
steps:
  # Y is local to the negation (existential: no child of X). Translate lifts it; accepted.
  # The shared-variable unsafe form stays covered by static-nonground-not-shared.yaml (rejected).
  - answers: {}
    expect:
      statuses: {c1: [{D: d, S: a, status: satisfied}]}
      verdict: PASS
