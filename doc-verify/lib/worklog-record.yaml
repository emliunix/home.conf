# doc-verify:worklog-record - a dated record: what was done, measured or decided, with its
# sources, never a standing rule. Opt-in: a worklog whose companion names `type: record` runs
# this module; an untyped worklog runs references alone. Extends doc-verify:references.
# A worked example lives at doc-verify/lib/examples/worklog-record.md.
schema_version: 2
kind: verification-module
module: doc-verify.worklog-record
extends: [doc-verify:references]
oracles:
  evidence_not_law(D, S):
    ask: >-
      The record reports dated work, evidence, commands or decisions with their sources, without
      asserting new standing rules that belong in a design or the canon.
    evidence: core.body(D, S)
    threshold: 0
    max_bytes: 36000
rules:
  outermost_selected(D, S): core.selected(D, S), core.section(D, S, P), not core.selected(D, P)
constraints:
  worklog-evidence-not-law:
    forall: core.meta(D, kind, worklog), outermost_selected(D, S)
    require: evidence_not_law(D, S)
    severity: error
    profiles: [promotion]
    message: "{S} in {D} asserts a standing rule instead of recording dated work with its sources"
    repair: "Record what was done, measured or decided and where it is evidenced; move the standing rule to the design or the canon file that owns it and cite it here."
