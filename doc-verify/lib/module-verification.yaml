# doc-verify:module-verification - a package's checks: every claimed property is paired with the
# check that witnesses it and that check's limit, as current law. Extends doc-verify:references.
# A worked example lives at doc-verify/lib/examples/module-verification.md.
schema_version: 2
kind: verification-module
module: doc-verify.module-verification
extends: [doc-verify:references]
oracles:
  pairs_every_property(D, S):
    ask: Every property id of the form P-<package>-NN this package claims is either named here with the check that witnesses it and that check's limit, or the section honestly names the gap. No claimed property is silently missing its check.
    evidence: core.body(D, S)
    threshold: 0.5
    max_bytes: 24000
  current_not_history(D, S):
    ask: This section states the checks as they are now, not how they came to be.
    evidence: core.own(D, S)
    threshold: 0.5
    max_bytes: 12000
rules:
  top(D, S): core.section(D, S, _), core.depth(D, S, 2)
constraints:
  module-verification-pairs:
    forall: core.meta(D, kind, 'module-verification'), top(D, S)
    require: pairs_every_property(D, S)
    severity: error
    profiles: [promotion]
    message: "{D} leaves a claimed property without its witnessing check"
    repair: "Pair every P-<pkg>-NN property with the check that witnesses it, and its limit."
  module-verification-is-current:
    forall: core.meta(D, kind, 'module-verification'), top(D, S)
    require: current_not_history(D, S)
    severity: error
    profiles: [promotion]
    message: "{S} in {D} narrates history instead of stating current law"
    repair: "State what is true now; the decision trail belongs in a design or the worklog."
