schema_version: 1
rubrics:
  threshold: 0.8
  items:
    - id: design.problem_resolved
      artifact_kinds: [design]
      applies_to:
        sections: [problem-statement, rationale]
        scope: combined
      evidence:
        source: section_body
        max_bytes: 12000
      question:
        kind: choose
        instruction: Does the proposed mechanism directly resolve the stated problem without relying on an unnamed decision?
        options: [supported, refuted, unknown]
      critical: true
      weight: 1
      scores: {supported: 1, refuted: 0, unknown: 0}
    - id: design.verification_falsifies
      artifact_kinds: [design]
      applies_to:
        sections: [verification-design]
        scope: combined
      evidence:
        source: section_body
        max_bytes: 12000
      question:
        kind: choose
        instruction: Does the verification design name observable failure witnesses for its load-bearing claims?
        options: [supported, refuted, unknown]
      critical: true
      weight: 1
      scores: {supported: 1, refuted: 0, unknown: 0}
