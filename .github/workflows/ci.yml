name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  mutations:
    name: mutations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:mutations

  document-contract:
    name: document-contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Structural ranged check. draft does not call the judge. Live promotion
      # checks are .github/workflows/judge-advisory.yml (real fail, not required).
      - run: npm exec doc-verify -- check --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" --profile draft --format json --output doc-verify-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-contract-report
          path: doc-verify-report.json
          if-no-files-found: ignore

  tracked-ignored:
    name: tracked-ignored
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-tracked-ignored.mjs
