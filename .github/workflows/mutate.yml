name: mutate

on:
  pull_request:
    paths:
      - "doc-verify/**"
      - "scripts/run-mutate-tables.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mutate.yml"
  workflow_dispatch:

jobs:
  mutate:
    name: mutate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: npm ci
        run: npm ci || { echo "npm ci retry after failure"; sleep 15; npm ci; }
      - run: npm test
      - run: npm run mutate
