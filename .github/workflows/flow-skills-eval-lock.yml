name: flow-skills-eval-lock

on:
  push:
    branches:
      - main
    paths:
      - "skills/flow-*/**"
      - "flow-skills-eval/**"
      - ".github/workflows/flow-skills-eval-lock.yml"
  pull_request:
    paths:
      - "skills/flow-*/**"
      - "flow-skills-eval/**"
      - ".github/workflows/flow-skills-eval-lock.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow-skills-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install the Vite+ runner
        run: npm install --global vite-plus@0.2.9
      - name: Install flow-skills-eval dependencies
        env:
          # The lockfile records registry.npmmirror.com tarball URLs. Matching
          # that registry keeps each locked tarball in registry scope instead
          # of making npm 12 classify it as an arbitrary remote fetch.
          npm_config_registry: https://registry.npmmirror.com
        run: vp install --frozen-lockfile
      - name: Verify the frozen prefix lock
        # Use the project-local runner, matching the pre-commit hook. The global
        # npx runner bootstraps installation but does not own the test module.
        run: ./node_modules/.bin/vp test --run tests/prompt.test.ts
