[project]
name = "herdr-group"
version = "0.1.0"
description = "Tests and research for the herdr-supervisor group-chat script"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "typer>=0.27.2",
]

[tool.uv]
package = false

[tool.pytest]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
