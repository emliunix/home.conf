# AGENTS.md snippets - manifest
#
# Ordered list of the snippets that compose AGENTS.md. The composer
# (AGENTS.md.compose.py) reads this file; AGENTS.md is generated, not
# hand-edited.
#
# The manifest is the authority for WHAT is in the composition and in WHAT
# ORDER. A snippet file not listed here does not ship; a listed file that is
# missing is an error, not a silent omission.
#
# Targets. AGENTS.md at this repo root is the source. The readers that pick
# it up:
#   pi    <agent-dir>/AGENTS.md, AGENTS.MD, CLAUDE.md, CLAUDE.MD
#         user instructions applied across working directories
#   codex ~/.codex/AGENTS.md
#         user-global guidance, true regardless of repo
# Both are COPIES, not links: pi reads its own agent directory, codex its
# own. `--install <path>` writes the same bytes to a second target, so the
# copies have one source and drift shows up as a diff.
#
# Why snippets instead of one file: a concern can be reviewed, changed and
# reverted on its own; the failure that earned a rule stays next to the rule;
# and "is this rule in the prompt right now?" becomes a question about the
# manifest rather than about someone's memory of an edit.

version: 1

output: AGENTS.md

header: |
  # User-global agent guidance

  Generated by `AGENTS.md.compose.py` from `AGENTS.md.snippets/manifest.yaml`.
  Edit the snippets, not this file.

  Machine-wide conventions that hold regardless of which repo you are in.
  Project-specific rules live in that project's own `AGENTS.md`.

snippets:
  - id: agent-phrasing
    path: AGENTS.md.snippets/agent-phrasing.md
    title: Reporting style
