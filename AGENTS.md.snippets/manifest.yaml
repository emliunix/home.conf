# AGENTS.md snippets - manifest
#
# Ordered list of the snippets that compose AGENTS.md. The composer
# (AGENTS.md.compose.py) reads this file; AGENTS.md is generated, not
# hand-edited.
#
# The manifest is the authority for WHAT is in the composition and in WHAT
# ORDER. A snippet file not listed here does not ship; a listed file that is
# missing is an error, not a silent omission.
#
# Targets. AGENTS.md at this repo root is the source. The readers that pick
# it up:
#   pi    <agent-dir>/AGENTS.md, AGENTS.MD, CLAUDE.md, CLAUDE.MD
#         user instructions applied across working directories
#   codex ~/.codex/AGENTS.md
#         user-global guidance, true regardless of repo
# Both are COPIES, not links: pi reads its own agent directory, codex its
# own. `--install <path>` writes the same bytes to a second target, so the
# copies have one source and drift shows up as a diff.
#
# Why snippets instead of one file: a concern can be reviewed, changed and
# reverted on its own; the failure that earned a rule stays next to the rule;
# and "is this rule in the prompt right now?" becomes a question about the
# manifest rather than about someone's memory of an edit.

version: 1

# Two outputs, one manifest. `output` is the publishable composition -- repo snippets
# only, so it is safe to commit and push. `local_output` adds the machine-specific
# roots and is written OUTSIDE the repo; it is what the runtimes actually read.
output: AGENTS.md
local_output: ~/.agents-local/AGENTS.md

# Search roots for `snippets[].path`, in order. The repo root is implicit and first,
# so the shared snippet is always found. Any earlier root here can SUPPLY or SHADOW a
# path -- which is how machine-specific content (live endpoints, account names,
# credential paths) is composed without being published in this public repo.
#
# Keep this list to paths that are safe to publish. The content under them is not
# published by being named here; it is read at compose time from the local machine.
snippet_roots:
  - ~/.agents-local/agents-snippets

# Two COMPOSITIONS, and they are different in kind -- not two copies of one file.
#
#   repo_header  -> AGENTS.md      instructions for working IN THIS REPO.
#                                  Committed. Nothing machine-specific.
#   user_header  -> local_output   instructions for every repo on this machine.
#                                  Written outside the repo, installed into the
#                                  agent runtimes. Carries the private overlay.
header: |
  # Working in home.conf

  Generated by `AGENTS.md.compose.py` from `AGENTS.md.snippets/manifest.yaml`.
  Edit the snippets, not this file; run the composer and commit both.

  ## The skills here are composed, not hand-written

  `skills/*/SKILL.md` are the sources. Anything generated - this file, the installed
  agent instructions - is built from snippets and must not be hand-edited:
  a hand edit is lost on the next compose, and `--check` fails on it.

  ```sh
  python3 AGENTS.md.compose.py          # compose both outputs
  python3 AGENTS.md.compose.py --check  # exit 1 if anything is out of date
  ```

  A snippet not listed in the manifest does not ship; a listed snippet that is
  missing is an error, not a silent omission.

  ## Nothing machine-specific goes in this repo

  This repository is public. Live endpoints, account names, credential paths, host
  ports, and anything derived from them belong in a snippet under a root outside the
  repo (`snippet_roots`, marked `local_only: true`). The repo composition excludes
  those by construction, and that is the only thing keeping them unpublished.

  ## Reporting standard

  Messages about work in this repo follow the shared brief form; see the
  user-global composition, or `skills/report-style/SKILL.md` §"Style hot words".

local_header: |
  # User-global agent guidance

  Generated by `AGENTS.md.compose.py` from `home.conf/AGENTS.md.snippets/manifest.yaml`.
  Edit the snippets, not this file.

  Machine-wide conventions and owned resources. Project-specific rules live in that
  project's own `AGENTS.md`; everything here is true regardless of which repo you
  are in.

snippets:
  - id: agent-phrasing
    path: AGENTS.md.snippets/agent-phrasing.md
    title: Reporting style

  # Machine-specific sections, resolved from ~/.agents-local/agents-snippets (see
  # snippet_roots). These carry live endpoints, account names and credential paths,
  # so the bodies live outside the repo; only their identity and order are here.
  - id: registries-and-mirrors
    local_only: true
    path: registries-and-mirrors.md
    title: Registries and mirrors
  - id: containers
    local_only: true
    path: containers.md
    title: Containers (Apple `container` + `container-compose`)
  - id: owned-resources
    local_only: true
    path: owned-resources.md
    title: Owned resources
  - id: credentials
    local_only: true
    path: credentials.md
    title: Credentials
  - id: working-habits
    local_only: true
    path: working-habits.md
    title: Working habits that have paid off here
