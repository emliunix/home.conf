# ⚠ EXTERNAL HOOKS BLOCK, AND THE EMPTY-POPULATION CASE MUST NOT (#38).
#
# These entries have never carried `home.conf`'s stage policy: a consumer's `document-contracts` is a
# BLOCKING hook, and `doc-verify/tests/remote-hook.sh` asserts exactly that (an invalid fixture must
# exit non-zero). Imposing "pre-commit warns" here would have silently inverted that contract -- and my
# first two attempts at this file each broke consumers in a different way:
#
#   1. a bare `doc-verify check --staged` -- correct until #38, because BLOCKED (exit 3) is now what an
#      empty population returns, and an empty index is the NORMAL state of a docs-only commit;
#   2. `node scripts/run-document-contracts.mjs ...` -- that wrapper is not in `package.json`'s
#      `files`, and prek resolves the entry in the CONSUMER's checkout, so a real consumer run died
#      MODULE_NOT_FOUND on `<consumer>/scripts/run-document-contracts.mjs`.
#
# The narrow fix is `--stage external`: still blocking for a real finding, not blocking for "nothing
# was selected". Consumers keep the semantics they had, and an empty index stops being a hard failure.
- id: document-contracts
  name: document contracts
  language: node
  entry: doc-verify check --staged --profile auto --format text --verbose --stage external
  pass_filenames: false
  files: '(^|/).+\.(md|ya?ml)$'
  require_serial: true
- id: document-structure
  name: document structure (whole repository, draft)
  language: node
  # Opt-in companion to document-contracts: every configured document, structural checks only (no
  # judge), so a reference broken by a change elsewhere is caught even when its document is not
  # staged.
  entry: doc-verify check --all --profile draft --format text --stage external
  pass_filenames: false
  files: '(^|/).+\.(md|ya?ml)$'
  require_serial: true
