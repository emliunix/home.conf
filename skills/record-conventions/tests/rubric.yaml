# record-conventions - rubrics by dimension
# An item names the defect that must flip it; a property item says so.
skill: record-conventions
dimensions:
  trigger:
    rubrics:
      - id: selection
        arms: [entry-only]
        control_substitutes: [distractor_set, excluded_shapes, route_repetition]
        pass_bar: fires on finding or adding a record; silent on trusting the manifest and on hand-writing a generated page
        items:
          - id: T-SELECT
            claim: "finding what a programme has run, or adding a record, selects this surface"
            red_when: "a distractor is selected instead"
          - id: T-SILENT
            claim: "the excluded shapes stay silent"
            red_when: "any surface fires on them"
      - id: generalisation
        arms: [entry-only]
        pass_bar: trap and paraphrase score alike
        items:
          - id: T-TRAP
            claim: "the excluded case dressed in record vocabulary stays silent"
            red_when: "the surface fires on the words \"manifest\" or \"record\""
          - id: T-PARA
            claim: "the same case without the vocabulary stays silent"
            red_when: "silence depends on the clause wording appearing in the task"
  procedure:
    rubrics:
      - id: read
        arms: [control, entry-only, full]
        pass_bar: the set is enumerated by convention and checked against the commits
        items:
          - id: P-ENUM
            claim: "the set is enumerated with ls by naming convention"
            red_when: "the manifest is the only source read"
          - id: P-COMMITS
            claim: "the set is checked against the commits and a mismatch is recorded"
            red_when: "a mismatch is reconciled silently or not looked for"
          - id: P-DATE
            claim: "a cited result's date is checked against the change it supports"
            red_when: "a result older than its fix is cited as support"
      - id: add
        arms: [control, entry-only, full]
        pass_bar: the four steps, in order, in one commit
        items:
          - id: P-NAME
            claim: "the file is named by convention"
            red_when: "an invented name that ls-enumeration would miss"
          - id: P-INDEX
            claim: "its row is appended to the programme's index"
            red_when: "the index lacks the new record"
          - id: P-REGEN
            claim: "generated pages are regenerated in the same commit as their evidence"
            red_when: "a generated page is hand-edited or left stale"
          - id: P-PIN
            claim: "the counts a test pins are updated"
            red_when: "the pinned-count test fails on the commit"
          - id: P-DECISION
            claim: "one decision row is written per landed unit"
            red_when: "a landed unit has no row"
  production:
    rubrics:
      - id: acceptance
        arms: [full]
        pass_bar: the commit passes the repository's own checks
        items:
          - id: R-TESTS
            claim: "the commit passes the tests that pin counts and the generator check"
            red_when: "either fails on the produced commit"
          - id: R-NAMES
            claim: "a new worklog file passes the name checker"
            red_when: "the checker exits non-zero on it"
  ablation:
    rubrics:
      - id: steps
        arms: [full, full-minus-one-step]
        pass_bar: each step either degrades the outcome or is deleted
        items:
          - id: A-STEP
            claim: "a step whose removal changes nothing on a trial that exercised it is decoration"
            red_when: "it survives a fair test"
          - id: A-UNPRICED
            claim: "a step the trial never exercised is recorded unpriced"
            red_when: "it is deleted on that evidence"
