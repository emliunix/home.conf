<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group Seat</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--dim:#6e6e73;--line:#e5e5ea;--accent:#0a66c2;--me:#f2f7fd;--to:#fff7e0;--bad:#c62828}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161618;--fg:#ececf0;--dim:#9a9aa2;--line:#2c2c30;--accent:#5aa2f0;--me:#1c2633;--to:#2a2414;--bad:#ef6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header b{font-size:15px}header span{color:var(--dim);font-size:12px}
#log{flex:1;overflow-y:auto;padding:4px 16px}
.m{padding:8px 16px;margin:0 -16px;border-bottom:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.m.me{background:var(--me)}.m.ctl{color:var(--dim);font-size:12px}
.h{color:var(--dim);font-size:12px;font-family:ui-monospace,SFMono-Regular,monospace}
.h b{color:var(--accent);font-weight:600}.h .to{color:var(--fg)}
.st{color:var(--dim);font-size:11px;font-family:ui-monospace,monospace}.bad{color:var(--bad)}
form{border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:13px;display:flex;gap:4px;align-items:center}
.muted{color:var(--dim);text-decoration:line-through}
input[type=text],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;min-height:72px;resize:vertical}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 18px;cursor:pointer}
button:disabled{opacity:.5}
#msg{font-size:12px}
</style></head><body>
<header><b>Group seat</b><span id="ws">connecting…</span></header>
<div id="log" aria-live="polite"></div>
<form id="f">
  <div class="row" id="to"></div>
  <div class="row"><label>re: <input type="text" id="re" size="14" placeholder="topic (optional)"></label><span id="msg"></span></div>
  <textarea id="body" placeholder="Message as user. Enter sends, Shift+Enter adds a newline. No to: means everyone reads, nobody in particular acts."></textarea>
  <div class="row"><button id="send">Send</button></div>
</form>
<script>
let last = "", seen = new Set();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function members() {
  try {
    const r = await (await fetch("members")).json();
    $("ws").textContent = `${r.group} · workspace ${r.workspace} · posting as user`;
    const box = $("to"), checked = new Set([...box.querySelectorAll("input:checked")].map(i => i.value));
    const muted = new Set(r.muted);
    box.innerHTML = '<span class="h">to:</span>' + r.members.map(n =>
      `<label class="${muted.has(n) ? "muted" : ""}" title="${muted.has(n) ? "muted: receives only when named in to:" : ""}"><input type="checkbox" value="${esc(n)}" ${checked.has(n) ? "checked" : ""}>${esc(n)}</label>`).join("");
  } catch (e) { $("ws").textContent = "seat unreachable"; }
}

function render(x) {
  const d = document.createElement("div");
  d.className = "m" + (x.from === "user" ? " me" : "") + (x.control ? " ctl" : "");
  const st = [];
  if ((x.delivered || []).length) st.push("✓ " + x.delivered.map(esc).join(" "));
  for (const [n, c] of Object.entries(x.failed || {})) st.push(`<span class="bad">✗ ${esc(n)} (${esc(c)})</span>`);
  if ((x.skipped || []).length) st.push("muted " + x.skipped.map(esc).join(" "));
  const to = x.to && x.to.length ? ` → <span class="to">${x.to.map(esc).join(", ")}</span>` : "";
  d.innerHTML = `<div class="h">${esc((x.ts || "").slice(11, 19))} <b>${esc(x.from || "?")}</b>${to}${x.re ? " · re:" + esc(x.re) : ""}${x.control ? " · " + esc(x.control) : ""}</div>`
    + (x.body ? esc(x.body) : "") + (st.length ? `<div class="st">${st.join("  ")}</div>` : "");
  return d;
}

async function poll() {
  try {
    const r = await (await fetch("log?after=" + encodeURIComponent(last))).json();
    const log = $("log"), stick = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
    for (const x of r.records) {
      const k = x.ts + "\u0000" + x.line;
      if (seen.has(k)) continue;
      seen.add(k);
      if (x.ts > last) last = x.ts;
      log.appendChild(render(x));
    }
    if (stick) log.scrollTop = log.scrollHeight;
  } catch (e) {}
}

$("body").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("f").requestSubmit(); }
});
$("f").onsubmit = async e => {
  e.preventDefault();
  const body = $("body").value.trim();
  if (!body) return;
  $("send").disabled = true; $("msg").textContent = "sending…"; $("msg").className = "";
  try {
    const to = [...$("to").querySelectorAll("input:checked")].map(i => i.value);
    const r = await fetch("send", {method: "POST", headers: {"content-type": "application/json"},
      body: JSON.stringify({to, re: $("re").value.trim(), body})});
    const j = await r.json();
    if (!r.ok) { $("msg").textContent = j.error; $("msg").className = "bad"; return; }
    $("body").value = "";
    const fails = Object.entries(j.failed || {});
    $("msg").textContent = fails.length ? "not delivered: " + fails.map(([n, c]) => `${n} (${c})`).join(", ") : "";
    $("msg").className = fails.length ? "bad" : "";
    poll();
  } catch (err) { $("msg").textContent = "seat unreachable"; $("msg").className = "bad"; }
  finally { $("send").disabled = false; }
};
members(); poll();
setInterval(poll, 1500); setInterval(members, 10000);
</script></body></html>
