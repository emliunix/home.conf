# home.conf's own privacy rules. Gitleaks covers the GENERAL credential forms; these cover the classes no
# default engine ships (@GameBoy's blob measurement: 1 PEM, 4 internal URLs, 0 absolute home paths).
#
# ⚠ [extend] useDefault IS NOT A NICETY: WITHOUT IT THIS FILE REPORTS CLEAN, FOREVER (@GameBoy).
#
# Measured on v8.30.1 against a clean directory holding ONLY a runtime-generated generic-api-key .json:
#
#   no --config                            exit 1   "leaks found: 1"
#   --config WITHOUT [extend]              exit 0   "INF no leaks found"     <-- the failure
#   --config WITH [extend] useDefault      exit 1   "leaks found: 1"
#
# Any --config REPLACES the default ruleset. The failure is NOT a silent drop and NOT an error: Gitleaks
# prints the ordinary clean line. A consumer whose config omits [extend] gets a CONFIDENT CLEAN REPORT,
# exit 0, on every commit, with the standard output of a working gate. That is worse than a crash.
#
# ⚠ So the constraint is "a config that does not extend REPORTS CLEAN", not "a config that does not
# extend is incomplete". Keep this line or the file becomes a blindfold.
title = "home.conf privacy rules"
[extend]
useDefault = true

[[rules]]
id = "internal-host"
description = "internal hostname that must not appear in a public repository"
regex = '''\b[a-z0-9-]+\.(?:internal|local|corp|lan)\b'''
[rules.allowlist]
regexes = ['''example\.(?:internal|local|corp)''', '''\bFAKE[a-z]*\.internal''']

[[rules]]
id = "absolute-user-path"
description = "absolute home-directory path identifying a person or machine"
regex = '''(?:/Users/|/home/)[A-Za-z][A-Za-z0-9._-]+'''
[rules.allowlist]
# `/Users/` alone is not identifying; a literal placeholder or the generic word is.
regexes = ['''(?:/Users/|/home/)(?:your[_-]?user|<user>|USER|username|example)''']

[[rules]]
id = "sensitive-file-path"
description = "a path that names a credential-bearing file"
regex = '''(?i)(?:\.env(\.[a-z0-9]+)?|[^/"'\s]+\.(?:pem|p12|pfx|key)|id_(?:rsa|ed25519)|credentials\.json)'''
[rules.allowlist]
regexes = ['''\.env\.example''', '''\bexample\.(?:pem|key)''']

# ⚠ THE SCANNER'S OWN DOCUMENTATION MUST STAY GREEN (#50 review, measured). Staging these two shipped
# files as NEW content produced 49 findings -- the reference material is ABOUT sensitive paths, internal
# hosts and key shapes, so every example in it matches. A normal documentation edit was impossible.
#
# The allowlist is the two EXACT PATHS, not a pattern: these are the package's own docs, and an exact list
# cannot silently widen the way a `skills/.*` glob would.
[[allowlists]]
description = "the privacy scanner's own shipped documentation"
paths = [
  '''^skills/privacy-review/SKILL\.md$''',
  '''^skills/privacy-review/references/patterns\.md$''',
]

# ⚠ THE DEFAULT RULESET MISSES BASE64 VALUES CONTAINING `+` OR `/` (#50 review, measured).
# Through the real gate: a JSON api_key whose base64 body starts with `/` was missed 3/3, one starting
# with `+` missed 3/3, while `A` and `7` were caught 3/3. Gitleaks' built-in entropy rule admits
# `[A-Za-z0-9]` in the leading position only, so a value beginning with either separator is invisible --
# and `/` and `+` are ordinary base64 characters. Reproduced here on fixed fixtures, not at random.
[[rules]]
id = "home-conf-base64-token"
description = "a long base64 token value, including values that start with + or /"
regex = '''(?:api[_-]?key|secret|token|password)["']?\s*[:=]\s*["']?[A-Za-z0-9+/]{32,}={0,2}'''
[rules.allowlist]
regexes = ['''(?i)(?:your[_-]?|example|placeholder|fake|test)''']
