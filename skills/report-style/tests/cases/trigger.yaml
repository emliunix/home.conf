# report-style - trigger cases, as canonical / trap / paraphrase triplets
# Each case cites the SKILL.md line that makes its expectation correct.
# The paraphrase is the same situation as its canonical without this skill's vocabulary: if only the
# canonical fires, the surface is reading words, not the shape.
skill: report-style
dimension: trigger
triplets:
  - behavior: a brief is wanted - a peer transfer of a design
    canonical:
      prompt: "Write a brief for a colleague who knows Temporal but not this work: how does taskboard-v3 actually achieve parallelism? Keep it to one sitting."
      expected: [report-style]
      cites: "SKILL.md:3-7 - the Use clause names the brief and its reader"
    trap:
      prompt: "Polish this paragraph for me and cut the AI tells."
      expected: []
      cites: "SKILL.md:8 - not for prose polish"
    paraphrase:
      prompt: "Turn my notes on the frontier into a write-up someone can follow without the repo open."
      expected: [report-style]
      cites: "SKILL.md:3-7 - the brief shape without the word brief or report"
  - behavior: a record is wanted - durable and source-keyed
    canonical:
      prompt: "Write the record for this round from the decisions log, with the source keys resolving in the legend."
      expected: [report-style]
      cites: "SKILL.md:4-5 - the record is built from abstract, description, diagrams and legend"
    trap:
      prompt: "The evidence is already enumerated in decisions.tsv - write me a record of it."
      expected: []
      cites: "SKILL.md:8-9 - not for a record whose evidence is already enumerated elsewhere"
    paraphrase:
      prompt: "The round is over; make the durable version, every fact keyed to its artifact."
      expected: [report-style]
      cites: "SKILL.md:4-5 - durable and source-keyed, without the word record"
  - behavior: the shape must be chosen before writing
    canonical:
      prompt: "We need to hand this design to a peer tomorrow and also keep an auditable version in the vault - what do I write?"
      expected: [report-style]
      cites: "SKILL.md:14-18 - pick one before writing; the two shapes are stated there"
    trap:
      prompt: "Review this report and tell me what is wrong with it."
      expected: []
      cites: "SKILL.md:8 - not for reviewing someone else's report (clause added after the trigger trial: route 2 fired visflow-evaluate without it, route 1 stayed silent)"
    paraphrase:
      prompt: "Same material, two readers: one tomorrow in chat, one in six months who was not here."
      expected: [report-style]
      cites: "SKILL.md:16-18 - a record survives the conversation, a brief may assume it"
run_notes:
  - "Arms: entry-only over the full catalog; control substitutes for the degenerate control are the distractor set and the excluded shapes above."
  - "Distractor probe (not scored here): 'teach me how the frontier works' and 'unslop this' belong to teach/technical-writing/unslop, which live at pstack/pstack/skills/ and carry disable-model-invocation - the probe tests other surfaces' territory, not this skill's exclusions."
  - "Scored items: T-SELECT, T-SILENT, T-VARIANT, T-TRAP, T-PARA. Ambiguity is a finding, never a miss."
  - "If the review trap fires, the fix is a description edit recorded in CHANGELOG.md, not a rubric change."
