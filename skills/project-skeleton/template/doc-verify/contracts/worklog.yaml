schema_version: 1
rubrics:
  kind: jev
  threshold: 0.8
  items:
    - id: worklog.evidence_not_law
      artifact_kinds: [worklog]
      applies_to:
        sections: ["@selected"]
        scope: combined
      evidence:
        source: section_body
        max_bytes: 16000
      question:
        kind: choose
        instruction: Does the record report dated work, evidence, commands or decisions with their sources, without asserting new standing rules that belong in a design or the canon?
        options: [supported, refuted, unknown]
      critical: false
      weight: 1
      scores: {supported: 1, refuted: 0, unknown: 0}
