schema_version: 1
rubrics:
  kind: jev
  threshold: 0.8
  items:
    - id: docs.current_not_history
      artifact_kinds: [docs]
      applies_to:
        sections: ["@selected"]
        scope: combined
      evidence:
        source: section_body
        max_bytes: 36000
      question:
        kind: choose
        instruction: Does the document state current behaviour or contract directly, rather than narrating how it came to be? A section explicitly labelled as open questions, a draft, or a non-goal is acceptable; fail only where dated history or unsettled speculation is presented as if it were current law.
        options: [supported, refuted, unknown]
      critical: true
      weight: 1
      scores: {supported: 1, refuted: 0, unknown: 0}
