# blind-trial - trigger cases, as canonical / trap / paraphrase triplets
# Rewritten without project nouns at the 2026-10-05 consolidation; one behaviour from each source scope
# (reader batch, author round) plus the summary-material exclusion. Each case cites the SKILL.md line
# that makes its expectation correct.
skill: blind-trial
dimension: trigger
triplets:
  - behavior: measuring whether the record onboards a newcomer
    canonical:
      prompt: "Measure whether the design tree onboards a reader who has never seen this repository."
      expected: [blind-trial]
      cites: "SKILL.md:7, 36-41 - measuring whether the record onboards a newcomer; a reader batch"
    trap:
      prompt: "One reader said the doc was confusing - should we ship the rewrite?"
      expected: []
      cites: "SKILL.md:8-9 - not when the evidence is one reader's impressions rather than a batch"
    paraphrase:
      prompt: "A colleague skimmed it and shrugged - proceed?"
      expected: []
      cites: "SKILL.md:8-9 - the same situation without the vocabulary"
  - behavior: measuring whether the surface lets someone produce a working program
    canonical:
      prompt: "Measure whether the authoring guide lets a stranger write a document that actually runs."
      expected: [blind-trial]
      cites: "SKILL.md:7-8, 64-65 - measuring the authoring surface; acceptance implies execution"
    trap:
      prompt: "Count how many times the suite compiled successfully."
      expected: []
      cites: "SKILL.md:9 - not when the measurement is compile counts"
    paraphrase:
      prompt: "It built without errors, so the doc must be fine, right?"
      expected: []
      cites: "SKILL.md:9 - the same situation without the vocabulary"
  - behavior: the trial material is the repository's own files
    canonical:
      prompt: "Give three fresh authors the repository's own surface documentation and see whether they can write a working program, blind and with the checker."
      expected: [blind-trial]
      cites: "SKILL.md:4-5, 20, 52-57 - the repository's own files; blind and assisted arms"
    trap:
      prompt: "Write a one-page summary of the surface and have a stranger try authoring from that."
      expected: []
      cites: "SKILL.md:9-10 - not when the material is a summary rather than the surface"
    paraphrase:
      prompt: "Have someone try writing a program from my cheat sheet."
      expected: []
      cites: "SKILL.md:9-10 - the same situation without the vocabulary"
run_notes:
  - "Arms: entry-only over the full catalog; the degenerate control is replaced by the distractor set, the excluded shapes, and route repetition."
  - "Scored items: T-SELECT, T-SILENT, T-TRAP, T-PARA. Ambiguity is a finding, never a miss; a co-fire with eval-prompt on the reader case is expected (its own trigger file lists it)."
  - "The trap and the paraphrase are the same situation; if only the trap stays silent, the surface is reading words, not the shape."
