# subagent-dispatch - rubrics by dimension
# An item names the defect that must flip it; a property item says so.
skill: subagent-dispatch
dimensions:
  trigger:
    rubrics:
      - id: selection
        arms: [entry-only]
        control_substitutes: [distractor_set, excluded_shapes, route_repetition]
        pass_bar: fires when work is split across subagents or a child could be reused; silent when no child is involved
        items:
          - id: T-SELECT
            claim: "splitting work across subagents, or reusing a child, selects this surface"
            red_when: "a distractor is selected instead"
          - id: T-SILENT
            claim: "work with no child involved stays silent"
            red_when: "any surface fires on it"
      - id: generalisation
        arms: [entry-only]
        pass_bar: trap and paraphrase score alike
        items:
          - id: T-TRAP
            claim: "a no-child case dressed in dispatch vocabulary stays silent"
            red_when: "the surface fires on the words \"prompt\", \"subagent\" or \"review\""
          - id: T-PARA
            claim: "the same case without the vocabulary stays silent"
            red_when: "silence depends on the clause wording appearing in the task"
  procedure:
    rubrics:
      - id: steps
        arms: [control, entry-only, full]
        pass_bar: every step observed in order, each with its evidence
        items:
          - id: P-ROUTE
            claim: "the model and effort come from the route table read from the workspace"
            red_when: "the route is chosen from memory while a table exists"
          - id: P-SPINE
            claim: "the brief names the reading order and the repository's own files"
            red_when: "the brief carries a parent-written summary instead"
          - id: P-ONEFILE
            claim: "each child has exactly one output file and is otherwise read-only"
            red_when: "two children write one path, or a child edits the tree"
          - id: P-REUSE
            claim: "same kind of work on the same subject goes back to the child that did it"
            red_when: "a fresh child is minted with no blinding, independence or new-topic reason recorded"
          - id: P-FREEZE
            claim: "the parent edits and commits nothing until the last child returns"
            red_when: "the commit log shows a parent commit during the dispatch"
          - id: P-LEVER
            claim: "the shared recipe is one artifact outside every delegate's write scope"
            red_when: "each brief restates the recipe, or a delegate can edit it"
          - id: P-CRITPATH
            claim: "no child sits on the critical path when the work can be done in-session"
            red_when: "the parent waits on a child for work it could do itself"
  production:
    rubrics:
      - id: acceptance
        arms: [full]
        pass_bar: every report is a measurement, against a stated commit
        items:
          - id: R-REPORT
            claim: "each report says what it read, what it found with file:line, the claim each finding contradicts and what it could not check"
            red_when: "a report asserts a finding with no location"
          - id: R-COMMIT
            claim: "the dispatch states the commit under test and harness output goes to a scratch path"
            red_when: "a child regenerates a recorded file during the measurement"
  ablation:
    rubrics:
      - id: steps
        arms: [full, full-minus-one-step]
        pass_bar: each step either degrades the outcome or is deleted
        items:
          - id: A-STEP
            claim: "a step whose removal changes nothing on a trial that exercised it is decoration"
            red_when: "it survives a fair test"
          - id: A-UNPRICED
            claim: "a step the trial never exercised is recorded unpriced"
            red_when: "it is deleted on that evidence"
